# Local development database only.
# Production runs MySQL installed directly on the client's server - see docs/DEPLOY.md.
services:
  mysql:
    image: mysql:8.4
    container_name: search-app-mysql
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: search_app
      MYSQL_USER: search_app
      MYSQL_PASSWORD: secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Default is 3; lowered so short Indonesian keywords ("id", "wa") are indexable.
      - --innodb-ft-min-token-size=1
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
